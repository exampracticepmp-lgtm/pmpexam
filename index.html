<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMP Practice Exam 1</title>
<style>
:root{--ink:#1b1f33;--muted:#5d6280;--blue:#2744c8;--blue2:#1f38a8;--green:#16794a;--red:#b3261e;--amber:#c27a00;--line:#dfe2ee}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);min-height:100vh;background:#2a1450 url(assets/bg.jpg) center/cover fixed no-repeat;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:28px 16px 40px}
.wide{max-width:900px}
.card{background:rgba(255,255,255,.93);border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:26px 24px;box-shadow:0 10px 40px rgba(20,0,60,.28);backdrop-filter:blur(8px)}
h1{margin:0 0 14px;font-size:30px;text-align:center;letter-spacing:-.5px}
h2{margin:0 0 10px;font-size:22px}
.sub{color:var(--muted);text-align:center;font-size:17px;line-height:1.5;margin:0 0 18px}
.price{font-size:54px;font-weight:800;text-align:center;margin:10px 0 14px;letter-spacing:-1px}
.desc{text-align:center;line-height:1.55;font-size:17px;margin:0 0 6px}
.support{font-size:15px;color:var(--muted);margin-top:10px}.support a{color:var(--blue);font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:700;background:var(--blue);color:#fff;margin-top:16px;box-shadow:0 4px 14px rgba(39,68,200,.35)}
.btn:hover{background:var(--blue2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.outline{background:#fff;color:var(--blue);border:2px solid var(--blue);box-shadow:none}
.btn.outline:hover{background:#eef1ff}
.btn.sm{display:inline-block;width:auto;padding:10px 18px;font-size:15px;margin:0}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.warn{background:var(--amber);box-shadow:none}
.note{color:#e9e4ff;text-align:center;font-size:16px;line-height:1.5;margin:14px 6px 0}
.review{margin:18px 4px 0;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.review .who{display:flex;gap:12px;align-items:center}
.avatar{width:52px;height:52px;border-radius:12px;background:rgba(255,255,255,.85);color:#2b3050;display:grid;place-items:center;font-weight:700;font-size:20px;text-shadow:none}
.review b{font-size:18px}.review small{display:block;opacity:.9}
.stars{color:#ffb400;font-size:30px;letter-spacing:2px;margin:8px 0 2px;text-shadow:none}
.review p{margin:4px 0 14px;font-size:17px;line-height:1.5}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password],textarea{width:100%;padding:13px 14px;border:1px solid #c9cde3;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:110px;resize:vertical}
.err{color:var(--red);font-weight:600;margin-top:12px;text-align:center;min-height:22px}
ul.rules{line-height:1.7;padding-left:20px;font-size:16.5px}
ul.rules li{margin-bottom:8px}
/* exam */
.topbar{position:sticky;top:0;z-index:20;background:rgba(24,12,56,.94);color:#fff;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 18px;flex-wrap:wrap}
.topbar .brand{font-weight:700}
.tools{display:flex;gap:8px}
.tool{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600}
.tool:hover{background:rgba(255,255,255,.22)}
.tool.on{background:#ffe66d;color:#241a00;border-color:#ffe66d}
.tool .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffb400;margin-left:6px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:10px}
.timer.low{background:#b3261e;color:#fff}
.exam{max-width:1180px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:70px;padding:18px}
.tlabel{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center}
.side .big{display:block;text-align:center;font-size:36px;background:#eef1ff;color:var(--blue);margin:6px 0 12px;padding:10px}
.side .big.low{background:#fde8e6;color:var(--red)}
.side .btn{margin-top:10px;padding:13px;font-size:16px}
.bnote{font-size:13px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.4}
.prog{margin:14px 0 6px;font-weight:600;text-align:center}
.navd summary{cursor:pointer;font-weight:700;padding:6px 0}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qnum{font-weight:800;color:var(--blue);font-size:15px;letter-spacing:.5px;text-transform:uppercase}
.flag{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;color:var(--muted)}
.flag.on{background:#fff4dc;border-color:#f0c36d;color:var(--amber)}
.qtext{font-size:19px;line-height:1.6;margin:6px 0 16px}
.hint{display:inline-block;background:#eef1ff;color:var(--blue);padding:4px 10px;border-radius:8px;font-weight:600;font-size:14px;margin-bottom:12px}
.hlbar{background:#fff8cc;border:1px solid #ecd75a;border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:14px;color:#4a3d00}
.choice{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:13px 14px;margin:10px 0;cursor:pointer;background:#fff;font-size:17px;line-height:1.5}
.choice:hover{border-color:#aab6f0}
.choice.sel{border-color:var(--blue);background:#eef1ff}
.choice input{margin-top:5px;accent-color:var(--blue);transform:scale(1.25)}
.letter{font-weight:800;color:var(--blue);min-width:20px}
.hlmode .choice{cursor:text}
.hlmode .qtext,.hlmode .choice span,.hlmode .casetx{cursor:text}
mark{background:#ffe66d;color:inherit;border-radius:3px;padding:0 1px}
.hlmode mark{cursor:pointer}
.case{background:#f4f5fb;border:1px solid var(--line);border-radius:12px;padding:4px 16px;margin-bottom:18px}
.case summary{cursor:pointer;font-weight:700;padding:10px 0}
.casetx{white-space:pre-line;line-height:1.6;margin:0 0 12px;font-size:16px}
.qimg{max-width:100%;border:1px solid var(--line);border-radius:10px;margin:0 0 16px;background:#fff}
.nav{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.nav .btn{margin:0;flex:1;min-width:110px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:10px 0}
.grid button{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px}
.grid button.ans{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid button.fl{outline:3px solid #f0a500}
.grid button.cur{box-shadow:0 0 0 3px #111 inset}
.legend{font-size:12.5px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,4,30,.62);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:#fff}
.panel{position:fixed;z-index:40;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(20,0,60,.35);padding:12px}
.panel h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.panel h3 button{border:0;background:none;font-size:20px;line-height:1}
#calc{right:16px;bottom:16px;width:264px}
#notes{right:16px;bottom:16px;width:320px}
#notes textarea{min-height:150px}
.cdisp{background:#101426;color:#fff;border-radius:10px;text-align:right;font-size:28px;padding:10px 12px;margin-bottom:8px;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ckeys button{padding:12px 0;border-radius:9px;border:1px solid var(--line);background:#f4f5fb;font-size:17px;font-weight:600}
.ckeys button.op{background:#e2e8ff;color:var(--blue)}.ckeys button.eq{background:var(--blue);color:#fff}
.bigscore{text-align:center}
.bigscore .pct{font-size:76px;font-weight:800;letter-spacing:-2px;color:var(--blue)}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.stat{background:#f4f5fb;border-radius:12px;padding:10px 18px;text-align:center;min-width:120px}
.stat b{display:block;font-size:22px}.stat span{font-size:13px;color:var(--muted)}
.revbanner{position:sticky;top:0;z-index:25;background:#ffe66d;color:#241a00;display:flex;gap:12px;justify-content:center;align-items:center;padding:12px 16px;flex-wrap:wrap;font-weight:600;text-align:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600}
.filters button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ri{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;background:#fff}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;margin-left:8px}
.chip.ok{background:#e3f5ec;color:var(--green)}.chip.no{background:#fde8e6;color:var(--red)}.chip.na{background:#eee;color:#555}
.ro{padding:9px 12px;border-radius:9px;margin:6px 0;border:1px solid var(--line);line-height:1.45}
.ro.right{background:#e3f5ec;border-color:#9bd3b5}.ro.wrong{background:#fde8e6;border-color:#f0a8a2}
.expl{background:#f4f5fb;border-left:4px solid var(--blue);padding:12px 14px;border-radius:8px;margin-top:12px;line-height:1.55;white-space:pre-line}
.stars-in{display:flex;gap:6px;justify-content:center;margin:10px 0}
.stars-in button{background:none;border:0;font-size:42px;color:#cfd2e3;padding:0;line-height:1}
.stars-in button.on{color:#ffb400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.breakbox{text-align:center}
.bigtimer{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;margin:14px 0;color:var(--blue)}
.match{display:grid;grid-template-columns:200px 1fr;gap:16px}
.pool,.targets{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafbff}
.mchip{display:block;width:100%;background:#dde6fb;border:1px solid #9db3ee;color:#17307f;font-weight:700;border-radius:10px;padding:14px 8px;margin:8px 0;text-align:center;cursor:grab;user-select:none}
.mchip.sel{outline:3px solid var(--blue)}
.mrow{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.slot{min-height:54px;border:2px dashed #7c8fe0;border-radius:10px;display:grid;place-items:center;color:#8a90b0;font-weight:600;padding:4px;cursor:pointer}
.slot.over{background:#eef1ff}.slot .mchip{margin:0}
.badge{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#12275e;color:#fff;font-weight:700;font-size:14px;margin-right:8px}
@media(min-width:901px){.topbar .timerv{display:none}}
@media(max-width:900px){.exam{grid-template-columns:1fr}.side{position:static}.side .big,.side .tlabel{display:none}}
@media(max-width:640px){.match{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}.price{font-size:46px}h1{font-size:26px}.topbar .brand{display:none}#calc,#notes{left:8px;right:8px;width:auto}.tool{padding:8px 10px;font-size:14px}}

/* ===== v3 redesign: split-card model + darts wallpaper ===== */
:root{--ink:#111427;--muted:#5f6784;--blue:#4338ca;--blue2:#3730a3;--navy:#111427;--green:#3f9468;--line:#e3e6f0}
body{background:#eef3fa url(assets/bg.jpg) 62% center/cover fixed no-repeat}
.page{min-height:100vh;display:flex;flex-direction:column}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}
.split{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1fr);width:100%;max-width:980px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 24px 70px rgba(15,18,50,.35)}
.split-l{background:linear-gradient(135deg,#312e81 0%,#161938 48%,#0f1226 100%);color:#fff;padding:36px 34px;display:flex;flex-direction:column}

.badge2{align-self:flex-start;background:rgba(99,102,241,.28);border:1px solid rgba(129,140,248,.5);color:#c7d2fe;font-weight:700;font-size:13px;letter-spacing:.8px;padding:7px 14px;border-radius:999px;text-transform:uppercase}
.split-l h2{font-size:34px;line-height:1.15;margin:26px 0 16px;letter-spacing:-.5px}

ul.checks li:before{content:"✓";color:#4ade80;font-weight:800}
.split-l .sup{margin-top:auto;padding-top:22px;border-top:1px solid rgba(255,255,255,.12);font-size:14.5px;color:#b8bfe6}
.split-l .sup a{color:#a5b4fc;text-decoration:none}
.split-r h2{margin:0 0 8px;font-size:28px;text-align:center;letter-spacing:-.4px}
.split-r .lead{text-align:center;color:var(--muted);font-size:16.5px;margin:0 0 22px;line-height:1.5}
.pricebox{border:1px solid var(--line);background:#f8f9fc;border-radius:14px;text-align:center;padding:16px 10px;margin-bottom:20px}
.pricebox small{display:block;font-weight:700;letter-spacing:1px;color:var(--muted);font-size:13px}
.pricebox b{font-size:46px;letter-spacing:-1px}.pricebox span{color:var(--muted);font-weight:600;margin-left:6px}
.btn{background:var(--navy);box-shadow:none;border-radius:12px;margin-top:0}

.btn.pay{background:var(--green);box-shadow:0 8px 20px rgba(63,148,104,.28)}
.btn.pay:hover{background:#36805a}

.or{display:flex;align-items:center;gap:12px;color:#8a91ad;font-weight:700;font-size:13px;letter-spacing:.8px;text-transform:uppercase;margin:20px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.fine{color:#8a91ad;font-size:14px;text-align:center;margin:16px 0 0;line-height:1.5}
.foot{background:#fff;border-top:1px solid var(--line);text-align:center;padding:16px;color:var(--muted);font-size:14.5px}
.foot a,.split-r a{color:var(--blue);text-decoration:none;font-weight:600}
.split-r label.f{font-size:14px}
.split-r .rules{margin:0 0 18px;font-size:15.5px}
.review{background:#fff;color:var(--ink);text-shadow:none;border-radius:14px;padding:14px 16px;margin:12px 0;width:100%;max-width:980px;box-shadow:0 10px 30px rgba(15,18,50,.18)}
.stars{font-size:20px;margin:6px 0 2px}
.avatar{background:#eef0ff;color:#312e81}
.card{background:rgba(255,255,255,.96);box-shadow:0 14px 44px rgba(15,18,50,.28)}

<body>
<div id="app"></div>
<script src="data.enc.js"></script>
<script>
/* ============ CONFIG (edit these) ============ */
const CONFIG={
  EXAM_TITLE:"PMP Practice Exam 1",
  PRICE:"$1.99",
  PAYPAL_URL:"https://www.paypal.com/ncp/payment/X82ZYXMNGRNXC",
  SUPPORT_EMAIL:"exampracticepmp@gmail.com",
  API_URL:"https://script.google.com/macros/s/AKfycbxuMEza6xMlD5GDBDBgyzoXADHwmxP8-sXqxGEwB2mq-6QnmWNq0VDhg-xhr5nCsb2zUw/exec",             // <- paste your Google Apps Script Web App URL here (see README)
  EXAM_MINUTES:240,       // 4 hours
  BREAK_MINUTES:10,       // two breaks of 10 minutes
  SECTION_ENDS:[59,120]   // break 1 after question 59, break 2 after question 120
};
/* =============================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS='pmp_exam1_state_v2',LSR='pmp_exam1_reviews_v2';
let DATA=null,S=null,tick=null,filter='all',hlOn=false;
const L=i=>String.fromCharCode(65+i);
const secOf=i=>i<CONFIG.SECTION_ENDS[0]?1:i<CONFIG.SECTION_ENDS[1]?2:3;

function load(){try{return JSON.parse(localStorage.getItem(LS))}catch(e){return null}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function newState(){return{phase:'intro',idx:0,answers:{},flags:{},notes:{},hl:{},remaining:CONFIG.EXAM_MINUTES*60000,endAt:null,used:{},offered:{},breakSec:null,breakEndAt:null,pending:null,startedAt:null,finishedAt:null,reviewed:false}}

/* ---------- crypto: the question bank is encrypted with the login ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptBank(user,pass){
  const E=window.PMP_ENC; if(!E) throw new Error('data');
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(user.trim().toLowerCase()+':'+pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.salt),iterations:E.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,b64(E.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- reviews ---------- */
function fmtDate(d){const x=new Date(d);return isNaN(x)?'':x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
async function fetchReviews(){
  let list=[];
  if(CONFIG.API_URL){try{const r=await fetch(CONFIG.API_URL+(CONFIG.API_URL.includes('?')?'&':'?')+'action=reviews');list=await r.json()}catch(e){}}
  if(!list.length){try{list=JSON.parse(localStorage.getItem(LSR))||[]}catch(e){}}
  return list.filter(r=>r&&r.comment).slice(0,3);
}
async function postReview(rv){
  const pub={name:rv.first+' '+(rv.last[0]||'').toUpperCase()+'.',rating:rv.rating,comment:rv.comment};
  try{const a=JSON.parse(localStorage.getItem(LSR))||[];a.unshift({...pub,date:new Date().toISOString()});localStorage.setItem(LSR,JSON.stringify(a.slice(0,20)))}catch(e){}
  if(CONFIG.API_URL){try{await fetch(CONFIG.API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'review',firstName:rv.first,lastName:rv.last,name:pub.name,rating:rv.rating,comment:rv.comment})})}catch(e){}}
}

/* ---------- helpers ---------- */
function show(html,keep){const y=window.scrollY;$('#app').innerHTML=html;if(!keep)window.scrollTo(0,0);else window.scrollTo(0,y)}
function closePanels(){['calc','notes'].forEach(id=>{const e=document.getElementById(id);if(e)e.remove()})}
function modal(inner){const el=document.createElement('div');el.className='modal';el.innerHTML='<div class="card">'+inner+'</div>';document.body.appendChild(el);return el}
const fmt=ms=>{const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return [h,m,x].map(v=>String(v).padStart(2,'0')).join(':')};
const left=()=>S.phase==='exam'?Math.max(0,S.endAt-Date.now()):S.remaining;


const LOCK='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-7-2a2 2 0 0 1 4 0v2h-4V7z"/></svg>';
function leftPanel(badge,title,text,items){
  return `<section class="split-l"><span class="badge2">${badge}</span><h2>${title}</h2><p>${text}</p>
  <ul class="checks">${items.map(i=>`<li>${i}</li>`).join('')}</ul>
  <div class="sup">Support: <a href="mailto:${esc(CONFIG.SUPPORT_EMAIL)}">${esc(CONFIG.SUPPORT_EMAIL)}</a></div></section>`;
}

/* ---------- highlight helpers ---------- */
function mergeR(r){r=r.slice().sort((a,b)=>a[0]-b[0]);const o=[];for(const x of r){if(o.length&&x[0]<=o[o.length-1][1])o[o.length-1][1]=Math.max(o[o.length-1][1],x[1]);else o.push(x.slice())}return o}
function hl(text,key,q){
  const r=mergeR(((S.hl[q.n]||{})[key])||[]);let out='',p=0;
  for(const [s,e] of r){if(s>=text.length)break;out+=esc(text.slice(p,s))+`<mark data-s="${s}" data-e="${e}">${esc(text.slice(s,e))}</mark>`;p=Math.min(e,text.length)}
  return out+esc(text.slice(p));
}
function onSelect(){

  S.hl[q.n]=S.hl[q.n]||{};S.hl[q.n][key]=mergeR([...(S.hl[q.n][key]||[]),[s,e]]);

}

/* ---------- calculator ---------- */
const C={d:'0',acc:null,op:null,fresh:true};
function cfmt(x){if(!isFinite(x))return 'Error';return String(parseFloat(x.toPrecision(12)))}
function cpress(k){
  const num=()=>parseFloat(C.d);
  if(C.d==='Error'&&k!=='C'){return}
  if(/^[0-9]$/.test(k)){if(C.fresh){C.d=k;C.fresh=false}else C.d=C.d==='0'?k:C.d+k}
  else if(k==='.'){if(C.fresh){C.d='0.';C.fresh=false}else if(!C.d.includes('.'))C.d+='.'}
  else if(k==='C'){C.d='0';C.acc=null;C.op=null;C.fresh=true}
  else if(k==='⌫'){if(!C.fresh&&C.d.length>1)C.d=C.d.slice(0,-1);else{C.d='0';C.fresh=true}}
  else if(k==='±'){C.d=C.d.startsWith('-')?C.d.slice(1):(C.d==='0'?'0':'-'+C.d)}
  else if(k==='%'){C.d=cfmt(num()/100);C.fresh=true}
  else if(k==='√'){C.d=num()<0?'Error':cfmt(Math.sqrt(num()));C.fresh=true}
  else if('+−×÷'.includes(k)){if(C.op&&!C.fresh){C.acc=ccalc();C.d=cfmt(C.acc)}else C.acc=num();C.op=k;C.fresh=true}
  else if(k==='='){if(C.op){C.d=cfmt(ccalc());C.acc=null;C.op=null;C.fresh=true}}
  const d=$('#cdisp');if(d)d.textContent=C.d;
}
function ccalc(){const a=C.acc,b=parseFloat(C.d);return C.op==='+'?a+b:C.op==='−'?a-b:C.op==='×'?a*b:b===0?NaN:a/b}
function toggleCalc(){
  const ex=$('#calc');if(ex){ex.remove();return}

  const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','=','√'];
  p.innerHTML=`<h3>Calculator <button id="cx" aria-label="Close">×</button></h3><div class="cdisp" id="cdisp">${esc(C.d)}</div><div class="ckeys">${keys.map(k=>`<button class="${'÷×−+'.includes(k)?'op':k==='='?'eq':''}" data-k="${k}">${k}</button>`).join('')}</div>`;
  document.body.appendChild(p);
  p.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>cpress(b.dataset.k));
  p.querySelector('#cx').onclick=()=>p.remove();
}

function wireMatch(q){

      <h1>Your result</h1>
      <div class="pct">${p(ok)}</div>
      <p class="sub" style="margin:0">${ok} of ${Q.length} questions answered correctly</p>
      <div class="stats"><div class="stat"><b style="color:var(--green)">${p(ok)}</b>Correct<br><span>${ok} questions</span></div><div class="stat"><b style="color:var(--red)">${p(bad)}</b>Wrong<br><span>${bad} questions</span></div><div class="stat"><b>${p(un)}</b>Unanswered<br><span>${un} questions</span></div><div class="stat"><b>${fmt(used)}</b>Time used</div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>Answer review &amp; explanations</h2>
      <div class="filters">${[['all','All'],['ok','Correct'],['bad','Wrong'],['un','Unanswered'],['fl','Flagged']].map(([k,t])=>`<button data-f="${k}" class="${filter===k?'on':''}">${t}</button>`).join('')}</div>
      ${list.map(reviewItem).join('')||'<p class="sub">Nothing to show for this filter.</p>'}
      <button class="btn outline" id="again">Start a new attempt</button>
    </div></div>`);
  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;results()});
  $('#again').onclick=()=>{if(confirm('Erase this attempt and start over?')){const r=S.reviewed;S=newState();S.reviewed=r;save();filter='all';hlOn=false;intro()}};
  if($('#rv'))$('#rv').onclick=feedback;
}
function reviewItem(q){
  const a=S.answers[q.n],isOk=correct(q),ans=answered(q);
  const chip=isOk?'<span class="chip ok">Correct</span>':ans?'<span class="chip no">Wrong</span>':'<span class="chip na">Unanswered</span>';
  const cs=q.case?`<div class="legend">${esc(DATA.cases[q.case].title)}</div>`:'';
  let inner='';
  if(q.type==='match'){
    inner=q.items.map((t,i)=>{const y=a&&a[i],r=q.answer[i];return `<div class="ro ${y===r?'right':'wrong'}"><span class="badge">${L(i)}</span>${esc(t)}<br><b>Your answer:</b> ${esc(y||'—')} ${y===r?'✓':`&nbsp;·&nbsp;<b>Correct:</b> ${esc(r)}`}</div>`}).join('');
  }else{
    inner=q.choices.map((c,i)=>{const isA=q.answer.includes(i),mine=a&&a.includes(i);
      return `<div class="ro ${isA?'right':mine?'wrong':''}"><b>${L(i)})</b> ${esc(c)} ${isA?'✓ <b>Correct answer</b>':''}${mine&&!isA?'✗ <b>Your answer</b>':mine&&isA?'· <b>Your answer</b>':''}</div>`}).join('');
  }
  const note=S.notes[q.n]?`<div class="expl" style="border-color:#ffb400"><b>Your comment:</b> ${esc(S.notes[q.n])}</div>`:'';
  return `<div class="ri"><div><b>Question ${q.n}</b>${chip}${S.flags[q.n]?'<span class="chip na">⚑ Flagged</span>':''}</div>${cs}
    <p style="line-height:1.6">${esc(q.text)}</p>${q.image?`<img class="qimg" src="${q.image}" alt="">`:''}${inner}<div class="expl"><b>Explanation.</b> ${esc(q.explanation)}</div>${note}</div>`;
}

/* ---------- review / feedback ---------- */
function feedback(){
  if(document.querySelector('.modal'))return;
  let rating=5;
  const el=modal(`<h2 style="text-align:center">How was your experience?</h2>
   <p class="sub" style="font-size:15px">Your review may be shown on the exam page (as first name + last initial) to help other candidates.</p>
   <div class="stars-in" id="st"></div>
   <div class="two"><div><label class="f" for="fn">First name</label><input type="text" id="fn" maxlength="30" autocomplete="given-name"></div>
   <div><label class="f" for="ln">Last name</label><input type="text" id="ln" maxlength="30" autocomplete="family-name"></div></div>
   <label class="f" for="rc">Your review</label><textarea id="rc" maxlength="500" placeholder="What did you think of the questions and explanations?"></textarea>
   <div class="err" id="re"></div>
   <div class="nav"><button class="btn ghost" id="sk">Later</button><button class="btn" id="sb">Submit review</button></div>`);
  const paint=()=>{el.querySelector('#st').innerHTML=[1,2,3,4,5].map(i=>`<button data-r="${i}" class="${i<=rating?'on':''}" aria-label="${i} stars">★</button>`).join('');el.querySelectorAll('#st button').forEach(b=>b.onclick=()=>{rating=+b.dataset.r;paint()})};paint();
  el.querySelector('#sk').onclick=()=>el.remove();
  el.querySelector('#sb').onclick=async()=>{
    const comment=el.querySelector('#rc').value.trim(),first=el.querySelector('#fn').value.trim(),last=el.querySelector('#ln').value.trim();
    if(!first||!last){el.querySelector('#re').textContent='Please enter your first and last name.';return}
    if(comment.length<5){el.querySelector('#re').textContent='Please write a short comment.';return}
    el.querySelector('#sb').disabled=true;
    await postReview({first,last,rating,comment});
    S.reviewed=true;save();
    el.querySelector('.card').innerHTML='<h2 style="text-align:center">Thank you! ★</h2><p class="sub">Your review has been submitted.</p><button class="btn" id="ok">View my answers</button>';
    el.querySelector('#ok').onclick=()=>{el.remove();results()};
  };
}
landing();
</script>
